<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        /**
         * Basic styling for the contact form.
         * Applies padding, borders, font, and layout for readability.
         */

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .contact-form {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        .contact-form h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .contact-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .contact-form input,
        .contact-form select,
        .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .contact-form button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .contact-form button:hover {
            background-color: #45a049;
        }

        .success-message {
            display: none;
            margin-top: 15px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Contact Form Section -->
    <form class="contact-form" id="contactForm">
        <h2>Contact Us</h2>
        <!-- Name Field -->
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <!-- Email Field -->
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email" required>

        <!-- Subject Dropdown -->
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
            <option value="">Select a subject</option>
            <option value="general">General Inquiry</option>
            <option value="support">Support</option>
            <option value="feedback">Feedback</option>
        </select>

        <!-- Message Textarea -->
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

        <!-- Submit Button -->
        <button type="submit">Submit</button>

        <!-- Success Message -->
        <p class="success-message" id="successMessage">Thank you! Your message has been sent.</p>
    </form>

    <script>
        /**
         * Simple form submission handler.
         * Prevents default submission, shows a success message.
         * 
         * Test Cases:
         * 1. Fill all fields and click submit → success message should appear.
         * 2. Leave any field empty → form should prevent submission.
         * 3. Try invalid email → browser should prevent submission.
         */

        const form = document.getElementById('contactForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent actual form submission
            // Show success message
            successMessage.style.display = 'block';
            // Optionally, reset the form
            form.reset();
        });
    </script>

</body>
</html>
